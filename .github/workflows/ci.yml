name: CI

on:
  push:
  pull_request:

jobs:
  # Host-run unit tests: the portable half of the firmware, built against the
  # fakes in src/board/native. No board involved.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native tests
        run: pio test -e native

  # Every board environment, every push, so one board's change cannot silently
  # break another's. The S3 joins this matrix in phase 3.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - m4
          - m4_release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.environment }}-
            pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      # secrets.h is gitignored (real WiFi creds); the placeholder is enough to
      # compile. Nothing here ever connects to WiFi.
      - name: Stub secrets.h
        run: cp include/secrets.h.example include/secrets.h

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
