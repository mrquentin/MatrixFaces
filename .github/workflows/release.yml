name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git describe resolves the tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      # secrets.h is gitignored (real WiFi creds); the placeholder is enough
      # to compile — this never connects to WiFi.
      - name: Stub secrets.h
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware
        run: pio run -e m4 -e m4_release -e s3 -e s3_release

      # Named by board. The S3 images are the application partition only, which
      # is what phase 6.3's OTA route will take; a first flash of a blank board
      # also needs the bootloader and partition table and is done with
      # `pio run -e s3 -t upload`.
      - name: Stage firmware artifacts
        run: |
          mkdir -p dist
          cp .pio/build/m4/firmware.bin "dist/matrixfaces-${GITHUB_REF_NAME}-m4.bin"
          cp .pio/build/m4_release/firmware.bin "dist/matrixfaces-${GITHUB_REF_NAME}-m4-release.bin"
          cp .pio/build/s3/firmware.bin "dist/matrixfaces-${GITHUB_REF_NAME}-s3.bin"
          cp .pio/build/s3_release/firmware.bin "dist/matrixfaces-${GITHUB_REF_NAME}-s3-release.bin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
