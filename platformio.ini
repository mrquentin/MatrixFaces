; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrix_portal_m4]
platform = atmelsam
board = adafruit_matrix_portal_m4
framework = arduino

monitor_speed = 115200

extra_scripts =
    pre:extract_version.py

; Pinned so a fresh checkout resolves the same code that is on the bench today.
; WiFiNINA has no releases on the Adafruit fork, so it floats at whatever HEAD
; was when you last cleaned .pio unless the commit is spelled out.
lib_deps =
    https://github.com/adafruit/WiFiNINA#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    adafruit/Adafruit Protomatter@^1.7.1
    adafruit/Adafruit GFX Library@^1.12.6

; Same firmware with the instrumentation compiled out: no /api/metrics endpoint,
; no cycle counting, no stack painting.
;   pio run -e release -t upload
[env:release]
extends = env:adafruit_matrix_portal_m4
build_flags =
    -DMETRICS_ENABLED=0

; The crypto library under lib/ is pure C++ with no Arduino dependency, so the
; known-answer tests run on the host instead of the board.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
