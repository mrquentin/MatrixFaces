; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrix_portal_m4]
platform = atmelsam
board = adafruit_matrix_portal_m4
framework = arduino

monitor_speed = 115200
upload_port = COM7

extra_scripts = pre:extract_version.py

lib_deps =
    https://github.com/adafruit/WiFiNINA

; Same firmware with the instrumentation compiled out: no /api/metrics endpoint,
; no cycle counting, no stack painting.
;   pio run -e release -t upload
[env:release]
extends = env:adafruit_matrix_portal_m4
build_flags =
    -DMETRICS_ENABLED=0

; The crypto library under lib/ is pure C++ with no Arduino dependency, so the
; known-answer tests run on the host instead of the board.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
