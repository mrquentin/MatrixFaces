; PlatformIO Project Configuration File
;
; Two boards, one source tree. The shape that makes that work:
;
;   - Per-target sources are selected by build_src_filter, never by #ifdef.
;     A board's directory is either compiled or it is not.
;   - Per-target headers are found via -Isrc/board/<target>, so shared code
;     writes #include "board_pins.h" and the build decides whose.
;   - Which apps ship is one file under src/variants/, also chosen by filter,
;     so a variant that drops an app drops its code and its buffers with it.
;
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200

; Both boards enumerate under Adafruit's USB vendor ID, so PlatformIO's
; "pick the best USB serial device" fallback can offer one board's firmware to
; the other. The script resolves the port from the board's own VID:PID and
; fails the upload rather than guessing. See docs/development.md.
extra_scripts =
    pre:extract_version.py
    pre:tools/pin_upload_port.py

; --- Matrix Portal M4 (SAMD51 + WiFiNINA) -----------------------------------

[samd51]
platform = atmelsam
board = adafruit_matrix_portal_m4
framework = arduino

; Pinned so a fresh checkout resolves the same code that is on the bench today.
; WiFiNINA has no releases on the Adafruit fork, so it floats at whatever HEAD
; was when you last cleaned .pio unless the commit is spelled out.
; Protomatter is not here: it is vendored in lib/Adafruit_Protomatter with
; three ESP32-S3 fixes. See that directory's FORK.md. The SAMD51 path is
; unmodified, so this board builds the same code it always did.
lib_deps =
    https://github.com/adafruit/WiFiNINA#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    adafruit/Adafruit GFX Library@^1.12.6
    bblanchon/ArduinoJson@^7.4.2

build_flags = -Isrc/board/samd51

; Everything except the other boards. Exactly one file under src/variants/ is
; compiled; with a single variant today that is the whole directory, and a
; second one would move the selection into the envs below. A missing or
; duplicated registerApps() is a link error, which is the intended safety net.
build_src_filter =
    +<*>
    -<board/esp32s3/>
    -<board/native/>
    -<diag/>

[env:m4]
extends = samd51

; Same firmware with the instrumentation compiled out: no /api/metrics
; endpoint, no cycle counting, no stack painting.
[env:m4_release]
extends = samd51
build_flags = ${samd51.build_flags} -DMETRICS_ENABLED=0

; --- MatrixPortal S3 (ESP32-S3, native WiFi) --------------------------------

[esp32s3]
platform = espressif32@7.0.1
board = adafruit_matrixportal_esp32s3
framework = arduino

; Replaces the board's stock partition table, which spends the second OTA slot
; on Adafruit's UF2 bootloader. Chosen once, now, so that adding a filesystem
; (5.3) and OTA (6.3) later never asks a paired board to be fully erased.
board_build.partitions = boards/partitions_8mb_ota.csv
board_build.filesystem = littlefs

; ...and stops the board definition from flashing that bootloader anyway. It
; writes tinyuf2.bin at 0x410000, which under the stock table is its own
; partition and under this one is the middle of the second OTA slot. Clearing
; the list leaves the three images an ESP32 actually needs: bootloader,
; partition table, and the otadata that says "boot app0".
board_upload.arduino.flash_extra_images =

; The chip's ROM download mode -- BOOT held while tapping RESET, which is the
; recovery path now that there is no UF2 drive -- enumerates on Espressif's
; USB-Serial-JTAG ID rather than Adafruit's, and the board definition does not
; list it. Without this, an upload to a board in that state is refused as "no
; MatrixPortal S3 attached". Read by tools/pin_upload_port.py.
custom_upload_hwids = 303A:1001

; Protomatter is vendored in lib/Adafruit_Protomatter -- see its FORK.md for
; the three changes and the measurements that justify each one.
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    bblanchon/ArduinoJson@^7.4.2

; The Arduino loop task's stack, doubled from the core's 8 KB default. Bring-up
; measured a 6560-byte peak on the stock size -- 1.6 KB of headroom, most of it
; spent at boot by AppSettingsStore::load(), which puts a 2.3 KB record array
; and a 2.3 KB blob on the stack at once. That is too little to grow into, and
; 8 KB of a 190 KB heap is a cheap answer. /api/metrics reports the peak, so
; this stays measurable rather than guessed at.
build_flags =
    -Isrc/board/esp32s3
    -DARDUINO_LOOP_STACK_SIZE=16384

build_src_filter =
    +<*>
    -<board/samd51/>
    -<board/native/>
    -<diag/>

[env:s3]
extends = esp32s3

; Diagnostic: compiles src/diag/flicker_probe.cpp *instead of* the firmware, to
; measure Protomatter's refresh timing in isolation. PROBE_STAGE bisects the
; cause; see that file and lib/Adafruit_Protomatter/FORK.md. It is in the CI
; matrix so it cannot quietly stop compiling -- phase 4.2 will want it working.
[env:s3_diag]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DPROBE_STAGE=1 -DPM_DIAG_COUNTERS
build_src_filter =
    -<*>
    +<diag/flicker_probe.cpp>

[env:s3_release]
extends = esp32s3
build_flags = ${esp32s3.build_flags} -DMETRICS_ENABLED=0

; --- Host ---------------------------------------------------------------

; The portable half of the firmware, built against the fakes in
; src/board/native. Modules join this list as they lose their board
; dependencies; anything still touching hardware stays out.
[env:native]
platform = native
test_framework = unity
extra_scripts =
build_flags =
    -std=c++17
    -Isrc
    -Isrc/board/native
    -Itest/support/fake_arduino
    ; ArduinoJson auto-detects the Arduino environment. On the host we want
    ; exactly one of its integrations: the Print writer, so sendJson() can
    ; stream to a Client the same way it does on the board.
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=1
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    ; The MSVC headers a Windows clang build picks up deprecate strncpy and
    ; friends. The firmware targets newlib, where they are not deprecated.
    -D_CRT_SECURE_NO_WARNINGS
lib_deps = bblanchon/ArduinoJson@^7.4.2
test_build_src = yes
build_src_filter =
    -<*>
    +<api/http_request.cpp>
    +<api/json_util.cpp>
    +<api/router.cpp>
    +<apps/settings_bag.cpp>
    +<board/native/>
    +<net/multiviewer_parse.cpp>
    +<net/mv_schedule.cpp>
    +<net/stream_read.cpp>
    +<storage/record_blob.cpp>
