; PlatformIO Project Configuration File
;
; One board today, two shortly. The shape that makes that work:
;
;   - Per-target sources are selected by build_src_filter, never by #ifdef.
;     A board's directory is either compiled or it is not.
;   - Per-target headers are found via -Isrc/board/<target>, so shared code
;     writes #include "board_pins.h" and the build decides whose.
;   - Which apps ship is one file under src/variants/, also chosen by filter,
;     so a variant that drops an app drops its code and its buffers with it.
;
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200

; --- Matrix Portal M4 (SAMD51 + WiFiNINA) -----------------------------------

[samd51]
platform = atmelsam
board = adafruit_matrix_portal_m4
framework = arduino
extra_scripts = pre:extract_version.py

; Pinned so a fresh checkout resolves the same code that is on the bench today.
; WiFiNINA has no releases on the Adafruit fork, so it floats at whatever HEAD
; was when you last cleaned .pio unless the commit is spelled out.
lib_deps =
    https://github.com/adafruit/WiFiNINA#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    adafruit/Adafruit Protomatter@^1.7.1
    adafruit/Adafruit GFX Library@^1.12.6
    bblanchon/ArduinoJson@^7.4.2

build_flags = -Isrc/board/samd51

; Everything except the other boards. Exactly one file under src/variants/ is
; compiled; with a single variant today that is the whole directory, and a
; second one would move the selection into the envs below. A missing or
; duplicated registerApps() is a link error, which is the intended safety net.
build_src_filter =
    +<*>
    -<board/native/>

[env:m4]
extends = samd51

; Same firmware with the instrumentation compiled out: no /api/metrics
; endpoint, no cycle counting, no stack painting.
[env:m4_release]
extends = samd51
build_flags = ${samd51.build_flags} -DMETRICS_ENABLED=0

; --- Host ---------------------------------------------------------------

; The portable half of the firmware, built against the fakes in
; src/board/native. Modules join this list as they lose their board
; dependencies; anything still touching hardware stays out.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Isrc
    -Isrc/board/native
    -Itest/support/fake_arduino
    ; ArduinoJson auto-detects the Arduino environment. On the host we want
    ; exactly one of its integrations: the Print writer, so sendJson() can
    ; stream to a Client the same way it does on the board.
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=1
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    ; The MSVC headers a Windows clang build picks up deprecate strncpy and
    ; friends. The firmware targets newlib, where they are not deprecated.
    -D_CRT_SECURE_NO_WARNINGS
lib_deps = bblanchon/ArduinoJson@^7.4.2
test_build_src = yes
build_src_filter =
    -<*>
    +<api/http_request.cpp>
    +<api/json_util.cpp>
    +<api/router.cpp>
    +<apps/settings_bag.cpp>
    +<board/native/>
    +<net/multiviewer_parse.cpp>
    +<net/stream_read.cpp>
    +<storage/record_blob.cpp>
