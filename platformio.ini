; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrix_portal_m4]
platform = atmelsam
board = adafruit_matrix_portal_m4
framework = arduino

monitor_speed = 115200

extra_scripts =
    pre:extract_version.py

; Pinned so a fresh checkout resolves the same code that is on the bench today.
; WiFiNINA has no releases on the Adafruit fork, so it floats at whatever HEAD
; was when you last cleaned .pio unless the commit is spelled out.
lib_deps =
    https://github.com/adafruit/WiFiNINA#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    adafruit/Adafruit Protomatter@^1.7.1
    adafruit/Adafruit GFX Library@^1.12.6
    bblanchon/ArduinoJson@^7.4.2

; Same firmware with the instrumentation compiled out: no /api/metrics endpoint,
; no cycle counting, no stack painting.
;   pio run -e release -t upload
[env:release]
extends = env:adafruit_matrix_portal_m4
build_flags =
    -DMETRICS_ENABLED=0

; The crypto library under lib/ is pure C++ with no Arduino dependency, so the
; known-answer tests run on the host instead of the board.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Isrc
    -Itest/support/fake_arduino
    ; ArduinoJson auto-detects the Arduino environment. On the host we want
    ; exactly one of its integrations: the Print writer, so sendJson() can
    ; stream to a Client the same way it does on the board.
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=1
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    ; The MSVC headers a Windows clang build picks up deprecate strncpy and
    ; friends. The firmware targets newlib, where they are not deprecated.
    -D_CRT_SECURE_NO_WARNINGS
lib_deps = bblanchon/ArduinoJson@^7.4.2
; The portable half of the firmware. Anything that reaches for board hardware
; stays out until phase 2.3 introduces src/board/native.
test_build_src = yes
build_src_filter =
    -<*>
    +<api/http_request.cpp>
    +<api/json_util.cpp>
    +<api/router.cpp>
    +<apps/settings_bag.cpp>
    +<net/multiviewer_parse.cpp>
    +<net/stream_read.cpp>
    +<storage/record_blob.cpp>
